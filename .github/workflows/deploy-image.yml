# deploy-image.yml
#
# Builds the RoleHunter container images and publishes them to GHCR so the k3d
# cluster on p510 (ArgoCD, factory-gitops apps/rolehunter) can pull them.
#
# Two images from the multi-stage Dockerfile:
#   - ghcr.io/olafkfreund/rolehunter           (target: runner   — the Next.js app)
#   - ghcr.io/olafkfreund/rolehunter-migrator  (target: migrator — drizzle migrate)
#
# Tags pushed: the branch name (e.g. `main`) and the commit SHA. Pin an immutable
# :<sha> in deploy/k8s/kustomization.yaml for production rollouts.
#
# NOTE: the GHCR packages are pulled in-cluster via the `ghcr-pull` imagePullSecret
# (already present in the `factory` namespace), so they can stay private.

name: Deploy Image

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'Dockerfile'
      - 'scripts/migrate.mjs'
      - '.github/workflows/deploy-image.yml'
  workflow_dispatch:

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/rolehunter
  IMAGE_MIGRATOR: ghcr.io/${{ github.repository_owner }}/rolehunter-migrator

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # write-back the pinned image tag to deploy/k8s
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase branch ref → a valid Docker tag (e.g. main).
      - name: Compute tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHA="${GITHUB_SHA::12}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build & push app image (runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_APP }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=rolehunter-runner
          cache-to: type=gha,mode=max,scope=rolehunter-runner

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATOR }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_MIGRATOR }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=rolehunter-migrator
          cache-to: type=gha,mode=max,scope=rolehunter-migrator

      # GitOps write-back: pin the deployed image to the immutable :<sha> in
      # deploy/k8s/kustomization.yaml and commit it back to main. ArgoCD watches
      # this repo (targetRevision: main) — pushing :main alone does NOT change
      # the manifest, so ArgoCD would never roll out. Bumping the pinned tag is
      # the diff that triggers the sync. deploy/k8s/** is intentionally not in
      # this workflow's path filter, and the commit carries [skip ci], so this
      # write-back never re-triggers the build.
      - name: Pin deployed image tag (GitOps write-back)
        env:
          SHA: ${{ steps.tags.outputs.sha }}
        run: |
          sed -i -E "s|^(\s*newTag:\s*).*$|\1${SHA}|" deploy/k8s/kustomization.yaml
          echo "--- kustomization images after pin ---"
          grep -nE "name:|newTag:" deploy/k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Image tag already pinned to ${SHA}; nothing to commit."
            exit 0
          fi
          git commit -m "chore(deploy): pin rolehunter images to ${SHA} [skip ci]"
          # Rebase onto any concurrent main changes, then push back.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo "- \`${IMAGE_APP}:${{ steps.tags.outputs.branch }}\` / \`:${{ steps.tags.outputs.sha }}\`"
            echo "- \`${IMAGE_MIGRATOR}:${{ steps.tags.outputs.branch }}\` / \`:${{ steps.tags.outputs.sha }}\`"
            echo ""
            echo "Pinned \`deploy/k8s/kustomization.yaml\` to \`:${{ steps.tags.outputs.sha }}\` and pushed to main — ArgoCD will sync the rollout."
          } >> "$GITHUB_STEP_SUMMARY"
