---
# The REST API RoleHunter exposes (Next.js route handlers under src/app/api).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: rolehunter-api
  description: "RoleHunter internal REST API — Next.js route handlers for jobs, applications, CVs, matching, gaps, interviews, flashcards, and admin. Representative subset documented below."
  annotations:
    github.com/project-slug: olafkfreund/rolehunter
    backstage.io/source-location: url:https://github.com/olafkfreund/rolehunter/tree/main/src/app/api/
  tags:
    - rest
    - internal
spec:
  type: openapi
  lifecycle: production
  owner: olafkfreund
  definition: |
    openapi: 3.0.3
    info:
      title: RoleHunter API
      version: "1.0"
      description: >-
        Internal REST API served by the RoleHunter Next.js app under /api.
        Loopback-only by default. This is a representative subset of the
        route handlers in src/app/api.
    servers:
      - url: http://127.0.0.1:{port}/api
        variables:
          port:
            default: "3000"
    paths:
      /health:
        get:
          summary: Liveness/readiness probe
          responses:
            "200": { description: OK }
      /jobs:
        get:
          summary: List ingested jobs
          responses:
            "200": { description: Job list }
        post:
          summary: Ingest a job from a pasted description
          responses:
            "201": { description: Created }
      /jobs/{id}:
        get:
          summary: Get a job with its match, CV variants, and flashcards
          parameters:
            - { name: id, in: path, required: true, schema: { type: string } }
          responses:
            "200": { description: Job detail }
      /jobs/search:
        post:
          summary: Live-search external job sources (JSearch / LinkedIn / JobSpy)
          responses:
            "200": { description: Search results }
      /match:
        post:
          summary: Score a job against the active master CV via the configured LLM
          responses:
            "200": { description: Match score with strengths, gaps, reasoning }
      /applications:
        get:
          summary: List applications
          responses:
            "200": { description: Application list }
        post:
          summary: Create an application from a job
          responses:
            "201": { description: Created }
      /cv/rewrite:
        post:
          summary: Generate a tailored, ATS-structured CV for a role
          responses:
            "200": { description: Tailored CV variant }
      /gaps:
        get:
          summary: Aggregated cross-role skill gaps
          responses:
            "200": { description: Clustered gap list }
      /gaps/refresh:
        post:
          summary: Re-cluster gap strings across all scored roles via one LLM call
          responses:
            "200": { description: Refreshed clusters }

