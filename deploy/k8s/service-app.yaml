# In-cluster service for the app (ArgoCD health + internal callers, and the
# target the in-cluster cloudflared routes public traffic to). Public exposure
# is via cloudflared (factory-gitops infra/cloudflared) → this Service :3000.
apiVersion: v1
kind: Service
metadata:
  name: rolehunter-app
  labels:
    app.kubernetes.io/name: rolehunter-app
    app.kubernetes.io/part-of: rolehunter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rolehunter-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
