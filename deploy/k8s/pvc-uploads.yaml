# Persistent storage for uploaded CVs/LinkedIn PDFs and generated CV/cover-letter
# PDFs (compose: the `uploads` Docker volume, mounted at /app/uploads).
# local-path is node-bound RWO, so the app runs single-replica with a Recreate
# strategy (an RWO PVC can't be attached to old+new pods during a rolling update).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rolehunter-uploads
  labels:
    app.kubernetes.io/name: rolehunter-app
    app.kubernetes.io/part-of: rolehunter
  annotations:
    # Same sync-wave as the app Deployment (its only consumer). local-path is
    # WaitForFirstConsumer, so the PVC only binds once a pod mounts it — if it
    # were an earlier wave, ArgoCD would block forever waiting for it to become
    # Healthy before creating the consumer. Applying them together lets the app
    # pod trigger binding.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
