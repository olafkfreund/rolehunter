# Headless service giving the StatefulSet a stable in-cluster DNS name.
# The app + migrate job connect to host `rolehunter-db` (resolves to
# rolehunter-db.factory.svc.cluster.local) on 5432.
apiVersion: v1
kind: Service
metadata:
  name: rolehunter-db
  labels:
    app.kubernetes.io/name: rolehunter-db
    app.kubernetes.io/part-of: rolehunter
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rolehunter-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
